<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="あたし">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<title>あたし</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;background:#f5f5f5;height:100dvh;display:flex;flex-direction:column}
#app{max-width:480px;width:100%;margin:0 auto;display:flex;flex-direction:column;height:100dvh;background:#fff}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:0.5px solid #e0e0e0;background:#fff;padding-top:max(12px,env(safe-area-inset-top))}
#topbar h2{font-size:16px;font-weight:600;color:#111}
#tab-btn{font-size:13px;padding:5px 12px;border-radius:20px;border:0.5px solid #ccc;background:transparent;color:#555;cursor:pointer}
#chat-view,#settings-view{display:flex;flex-direction:column;flex:1;overflow:hidden}
#settings-view{display:none;overflow-y:auto;padding:16px;gap:12px}
#settings-view h3{font-size:15px;font-weight:600;color:#111;margin-bottom:4px}
#messages{flex:1;padding:14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.msg{max-width:82%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.6;word-break:break-word}
.msg.user{align-self:flex-end;background:#378ADD;color:#fff;border-bottom-right-radius:4px}
.msg.bot{align-self:flex-start;background:#f0f0f0;color:#111;border-bottom-left-radius:4px}
.msg.loading{color:#999;font-style:italic}
.msg.bot .intro{margin-bottom:8px}
.msg.bot .list-item{display:flex;gap:8px;padding:6px 0;border-bottom:0.5px solid #ddd}
.msg.bot .list-item:last-child{border-bottom:none}
.msg.bot .list-bullet{color:#378ADD;font-weight:600;flex-shrink:0}
.msg.bot .list-text{flex:1}
.msg.bot .list-label{font-size:12px;color:#888;margin-bottom:1px}
.msg.bot .list-value{font-size:15px;font-weight:500;color:#111}
#input-row{padding:10px 12px;padding-bottom:max(10px,env(safe-area-inset-bottom));border-top:0.5px solid #e0e0e0;display:flex;gap:8px;align-items:center;background:#fff}
#main-input{flex:1;border:0.5px solid #ccc;border-radius:22px;padding:10px 16px;font-size:15px;background:#f8f8f8;color:#111;outline:none;-webkit-appearance:none}
#main-input:focus{border-color:#378ADD;background:#fff}
#send-btn{padding:10px 16px;border-radius:22px;background:#378ADD;color:#fff;border:none;cursor:pointer;font-size:15px;font-weight:500;white-space:nowrap}
#send-btn:disabled{opacity:0.4}
.kw-card{border:0.5px solid #e0e0e0;border-radius:12px;padding:12px;background:#fafafa;display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.kw-card-top{display:flex;align-items:center;gap:8px}
.kw-label{font-size:14px;font-weight:500;color:#111;flex:1}
.del-btn{font-size:12px;padding:3px 10px;border-radius:8px;border:0.5px solid #ccc;background:transparent;color:#999;cursor:pointer}
.kw-card textarea{width:100%;border:0.5px solid #ccc;border-radius:8px;padding:8px 10px;font-size:13px;background:#fff;color:#111;resize:vertical;min-height:65px;font-family:inherit}
.kw-card textarea:focus{outline:none;border-color:#378ADD}
.save-btn{font-size:13px;padding:5px 14px;border-radius:8px;border:0.5px solid #ccc;background:#fff;color:#111;cursor:pointer;align-self:flex-end}
#add-kw-area{border:1px dashed #ccc;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;margin-top:4px}
#add-kw-area label{font-size:13px;color:#555}
#add-kw-area input{border:0.5px solid #ccc;border-radius:8px;padding:7px 10px;font-size:14px;background:#fff;color:#111;width:100%}
#add-btn{padding:7px 16px;border-radius:8px;background:#378ADD;color:#fff;border:none;cursor:pointer;font-size:14px;align-self:flex-start}
#api-section{background:#fff3cd;border:0.5px solid #ffc107;border-radius:12px;padding:12px;margin-bottom:12px}
#api-section label{font-size:13px;color:#856404;display:block;margin-bottom:6px;font-weight:500}
#api-key-input{width:100%;border:0.5px solid #ffc107;border-radius:8px;padding:7px 10px;font-size:13px;background:#fff;color:#111;font-family:monospace}
#save-api-btn{margin-top:8px;padding:5px 14px;border-radius:8px;background:#856404;color:#fff;border:none;cursor:pointer;font-size:13px}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <h2>あたし</h2>
    <button id="tab-btn" onclick="toggleView()">⚙ 設定</button>
  </div>
  <div id="chat-view">
    <div id="messages"></div>
    <div id="input-row">
      <input type="text" id="main-input" placeholder="今どんな気持ち？" autocomplete="off" />
      <button id="send-btn" onclick="handleSend()">送信</button>
    </div>
  </div>
  <div id="settings-view">
    <h3>APIキー</h3>
    <div id="api-section">
      <label>Anthropic APIキー（ sk-ant-... ）</label>
      <input type="password" id="api-key-input" placeholder="sk-ant-api03-..." />
      <button id="save-api-btn" onclick="saveApiKey()">保存</button>
    </div>
    <h3>キーワード一覧</h3>
    <div id="kw-list"></div>
    <div id="add-kw-area">
      <label>新しいキーワード</label>
      <input type="text" id="new-kw" placeholder="例：酒飲みたい" />
      <button id="add-btn" onclick="addKeyword()">追加</button>
    </div>
  </div>
</div>
<script>
const DEFAULT_KW=[
  {kw:'お金がたまった',context:'30万円：アムス旅行\n25万円：デノンのCDJ\n10万円：カメラレンズ'},
  {kw:'ODしたい',context:'臓器へのダメージがやばい\n次の日最悪な気分になる\n繰り返すたびに効かなくなる'},
  {kw:'腹が減った',context:'冷蔵庫に卵とチーズある\n近所にローソンある\n昨日残したカレーある'},
  {kw:'筋トレしたくない',context:'3ヶ月で5kg絞る目標がある\n10分だけやれば絶対やる気出る'},
  {kw:'ウェアラブル作りたい',context:'構成：XIAO + OLED + GY-87\n使い方：首から下げる\n条件：半田付けなし\nディスプレイ：でかいほうがいい'}
];

let keywords=JSON.parse(localStorage.getItem('atashi_kw3')||'null')||DEFAULT_KW;
let apiKey=localStorage.getItem('atashi_api')||'';
let isChat=true,isLoading=false,regMode=null;

function save(){localStorage.setItem('atashi_kw3',JSON.stringify(keywords));}
function saveApiKey(){
  const v=document.getElementById('api-key-input').value.trim();
  if(!v)return;
  apiKey=v;localStorage.setItem('atashi_api',v);
  document.getElementById('save-api-btn').textContent='保存済 ✓';
  setTimeout(()=>document.getElementById('save-api-btn').textContent='保存',1500);
}

function toggleView(){
  isChat=!isChat;
  document.getElementById('chat-view').style.display=isChat?'flex':'none';
  document.getElementById('settings-view').style.display=isChat?'none':'flex';
  document.getElementById('tab-btn').textContent=isChat?'⚙ 設定':'← 戻る';
  if(!isChat){renderSettings();if(apiKey)document.getElementById('api-key-input').value=apiKey;}
}

function renderSettings(){
  const el=document.getElementById('kw-list');el.innerHTML='';
  keywords.forEach((k,i)=>{
    const div=document.createElement('div');div.className='kw-card';
    div.innerHTML=`<div class="kw-card-top"><span class="kw-label">「${k.kw}」</span>
      <button class="del-btn" onclick="deleteKw(${i})">削除</button></div>
      <textarea>${k.context||''}</textarea>
      <button class="save-btn" onclick="saveKw(${i},this)">保存</button>`;
    el.appendChild(div);
  });
}
function saveKw(i,btn){
  const card=btn.closest('.kw-card');
  keywords[i].context=card.querySelector('textarea').value;
  save();btn.textContent='保存済 ✓';setTimeout(()=>btn.textContent='保存',1200);
}
function deleteKw(i){keywords.splice(i,1);save();renderSettings();}
function addKeyword(){
  const kw=document.getElementById('new-kw').value.trim();
  if(!kw)return;
  keywords.push({kw,context:''});save();
  document.getElementById('new-kw').value='';renderSettings();
}

const msgsEl=document.getElementById('messages');

// テキストをパースしてリスト形式で表示
function renderBotMsg(text){
  const div=document.createElement('div');
  div.className='msg bot';
  const lines=text.split('\n').filter(l=>l.trim());
  lines.forEach(line=>{
    const clean=line.replace(/^[・\-\*▸\s]+/,'').trim();
    const isList=/[：:]/.test(clean)||/^[・\-\*▸]/.test(line.trim());
    if(isList){
      const item=document.createElement('div');
      item.className='list-item';
      const m=clean.match(/^(.+?)[：:]\s*(.+)$/);
      if(m){
        item.innerHTML=`<span class="list-bullet">▸</span><span class="list-text"><span class="list-label">${m[1].trim()}</span><span class="list-value">${m[2].trim()}</span></span>`;
      } else {
        item.innerHTML=`<span class="list-bullet">▸</span><span class="list-text"><span class="list-value">${clean}</span></span>`;
      }
      div.appendChild(item);
    } else {
      const p=document.createElement('div');
      p.className='intro';
      p.textContent=clean;
      div.appendChild(p);
    }
  });
  msgsEl.appendChild(div);
  msgsEl.scrollTop=msgsEl.scrollHeight;
  return div;
}

function addMsg(text,who,loading=false){
  const div=document.createElement('div');
  div.className=`msg ${who}${loading?' loading':''}`;
  div.textContent=text;
  msgsEl.appendChild(div);msgsEl.scrollTop=msgsEl.scrollHeight;
  return div;
}

async function callAI(kw,context,userMsg){
  if(!apiKey) return '設定画面でAPIキーを入れてくれ';
  const ctx=context?`\n\n【登録情報】\n${context}`:'';
  const prompt=`ユーザーが「${userMsg}」と言ってきた。${ctx}

以下のどれかのスタイルでランダムに返して（毎回違うスタイルにして）：
- 一言きつめ＋でも突き放さない温かさ
- テンション上げ系
- 静かに背中を押す系
- 共感してから行動を促す系

登録情報がある場合はそれをリスト形式で見やすく含めて。
一人称は「あたし」。タメ口。200字以内。絵文字なし。説教くさくしない。`;

  let resStatus='', resBody='';
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':apiKey,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-haiku-4-5-20251001',max_tokens:400,
        system:'あなたはユーザーのフランクな友達。一人称は必ず「あたし」。タメ口、絵文字なし、説教くさくない。相手を本当に大切に思ってる。「私」「俺」「僕」は絶対使わない。',
        messages:[{role:'user',content:prompt}]
      })
    });
    resStatus=res.status;
    const data=await res.json();
    resBody=JSON.stringify(data).slice(0,200);
    if(!res.ok) throw new Error(`HTTP ${res.status}: ${JSON.stringify(data)}`);
    return data.content?.[0]?.text||null;
  }catch(e){
    throw new Error(`status=${resStatus} body=${resBody} err=${e.message}`);
  }
}

async function fireAI(matched,trigger){
  isLoading=true;
  document.getElementById('send-btn').disabled=true;
  const loadDiv=addMsg('...','bot loading');
  let reply=null;
  for(let i=0;i<3;i++){
    try{
      reply=await callAI(matched.kw,matched.context,trigger);
      if(reply) break;
    }catch(e){
      if(i===2) reply='エラー: '+e.message;
      else await new Promise(r=>setTimeout(r,1000));
    }
  }
  loadDiv.remove();
  renderBotMsg(reply||'ごめん、今うまく返せんかった。もう一回打ってみて');
  isLoading=false;
  document.getElementById('send-btn').disabled=false;
}

async function handleSend(){
  if(isLoading)return;
  const input=document.getElementById('main-input');
  const val=input.value.trim();if(!val)return;
  input.value='';

  if(regMode&&regMode.step==='context'){
    addMsg(val,'user');
    const newKw={kw:regMode.kw,context:val};
    const idx=keywords.findIndex(k=>k.kw===regMode.kw);
    if(idx>=0) keywords[idx]=newKw; else keywords.push(newKw);
    save();regMode=null;
    addMsg('覚えた','bot');
    await fireAI(newKw,newKw.kw);
    return;
  }

  addMsg(val,'user');
  const matched=keywords.find(k=>val.includes(k.kw));

  if(!matched){
    addMsg(`「${val}」ね。あたしが参考にしたい情報書いといてくれる？リストでも理由でも何でも。`,'bot');
    regMode={step:'context',kw:val};
    return;
  }
  if(!matched.context){
    addMsg(`「${matched.kw}」の情報まだないや。あたしが参考にしたいこと書いてくれ。`,'bot');
    regMode={step:'context',kw:matched.kw};
    return;
  }
  await fireAI(matched,val);
}

document.getElementById('main-input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleSend();}
});

// SW登録
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

addMsg('よ。何かあったら打ってみ。','bot');
</script>
</body>
</html>
